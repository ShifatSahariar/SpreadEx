name: Clean-install acceptance

# SpreadEx as an installed product (not PYTHONPATH=src), one Python, three OSes.
# The checks live in scripts/acceptance/run_acceptance.py so they run the same way locally;
# this workflow only orchestrates them. Generator environments are never cached: every job
# installs the pinned generators from scratch. Only pip's download cache is reused.

on:
  push: {branches: [main, master]}
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run: {shell: bash}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SpreadEx into a fresh virtual environment (not editable)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then
            PY="$RUNNER_TEMP/venv/Scripts/python.exe"; BIN="$RUNNER_TEMP/venv/Scripts"
          else
            PY="$RUNNER_TEMP/venv/bin/python"; BIN="$RUNNER_TEMP/venv/bin"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install ".[dev]"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"
          "$PY" -c "import spreadex, sys; print(spreadex.__file__); assert 'site-packages' in spreadex.__file__"

      # The unit suite gets its own isolated home and generator cache; some tests run real
      # generators, so the pinned ones are installed there first (host generators stay off).
      - name: Unit suite against the installed package
        env:
          SPREADEX_HOME: ${{ runner.temp }}/unit-home
          SPREADEX_CACHE: ${{ runner.temp }}/unit-cache
        run: |
          mkdir -p logs
          start=$(date +%s)
          spreadex generators install fuzzingbook fandango grammarinator 2>&1 | tee logs/unit-generator-install.log
          echo "unit generator install: $(( $(date +%s) - start ))s" | tee -a logs/timings.txt
          "$PY" -m pytest tests -q -p no:cacheprovider -m "not network" --ignore=tests/golden \
            -rfE --junitxml=logs/unit-junit.xml 2>&1 | tee logs/unit.log
          exit ${PIPESTATUS[0]}

      - name: Acceptance A (demo) and B (stranger SUT)
        if: always()
        run: |
          "$PY" scripts/acceptance/run_acceptance.py --out acceptance-out 2>&1 | tee logs/acceptance.log
          status=${PIPESTATUS[0]}
          if [ -f acceptance-out/report.json ]; then
            { echo "### ${{ matrix.os }}"; echo '```json'
              "$PY" -c "import json;r=json.load(open('acceptance-out/report.json'));print(json.dumps({k:r[k] for k in ('platform','passed','journeys','timings_s')},indent=1))"
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Journey C: the setup wizard in a real browser, against the same installed package.
      - name: Acceptance C (setup wizard in a browser)
        if: always()
        run: |
          "$PY" -m pip install playwright
          "$PY" -m playwright install --with-deps chromium
          "$PY" scripts/acceptance/setup_ui_acceptance.py --out acceptance-out 2>&1 | tee logs/setup-ui.log
          exit ${PIPESTATUS[0]}

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            logs/
            acceptance-out/
          retention-days: 14
