[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadex"
version = "0.1.0a0"
description = "Local-first harness that runs multiple grammar-based generators against a system under test and spends a finite budget on the inputs most worth executing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["fuzzing", "grammar", "testing", "compiler-testing", "test-prioritization"]

# Deliberately small: no torch, no pandas, no Docker, no JDK.
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "PyYAML>=6.0"]

[project.optional-dependencies]
neural = ["torch>=2.0", "transformers>=4.35"]
dev = ["pytest>=7.0"]
# Only needed to run tests/golden against the research repository.
golden = ["pytest>=7.0", "pandas>=2.0", "hdbscan>=0.8.33"]

[project.scripts]
spreadex = "spreadex.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spreadex.corpus" = ["*.sql"]
"spreadex.generators" = ["catalog/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs PyPI access (deselect with -m 'not network')"]
pythonpath = ["tests/golden"]
