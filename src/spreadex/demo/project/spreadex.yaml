# The SpreadEx demo, written by `spreadex demo`. A real campaign against a
# real system under test -- nothing here is canned.
sut:
  command: ["python3", "./calc.py", "{input}"]
  timeout: 5s

oracle:
  type: crash
  # calc.py reports input it cannot read, and exits non-zero to say so. That
  # is the system working. Without this line every invalid expression -- most
  # of what a fuzzer produces -- would be reported as a crash.
  rejection_patterns:
    - "^calc: SyntaxError"

grammar:
  source: ./calc.bnf

# Three generators, so the campaign can compare them. After generating, SpreadEx
# builds one diversity map over all their inputs, measures each generator's
# Cluster Coverage, keeps the one that reached the most clusters, and executes
# only its inputs, in SpreadEx priority order.
generators: [fuzzingbook, fandango, grammarinator]

selection:
  by: cc
  keep: 1

# Fandango can follow a constraint on top of the grammar: here, never divide by a
# literal zero. calc.py already rejects that correctly, so such inputs would only
# spend budget. The remainder operator is deliberately left alone.
semantics:
  guidance: [spec/rules.md]               # the rule, in plain language
  native:
    fandango: spec/constraints.fan        # the same rule, in Fandango's own format

corpus:
  path: ./seeds

generation:
  count: 40   # per generator: equal count, reproducible

budget:
  generation: 30s
  execution: 60s

selection_signal: cc
embedding:
  model: tfidf
seed: 42
