id: grammarinator
name: Grammarinator
summary: ANTLRv4-driven generator; unlocks the ANTLR grammar ecosystem.
homepage: https://github.com/renatahodovan/grammarinator
license: BSD-3-Clause
install:
  type: python
  package: grammarinator
check:
  type: command
  command: [grammarinator-process, --version]
reference:
  venue: A-TEST
  year: 2018
  authors: 'Hodován et al.'
  title: 'Grammarinator: a grammar-based open source fuzzer'
family: probabilistic
capabilities:
  grammar: antlr4
  constraints: false
generation:
  # Two steps: grammarinator-process compiles the .g4 into a Python generator
  # class (cached by grammar content), then grammarinator-generate runs it.
  cli: [process, generate]
