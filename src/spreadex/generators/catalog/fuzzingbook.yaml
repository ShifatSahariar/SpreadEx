id: fuzzingbook
name: FuzzingBook
summary: Probabilistic grammar fuzzer from the Fuzzing Book.
homepage: https://www.fuzzingbook.org/
license: MIT
install:
  type: python
  package: fuzzingbook
  version: "==1.2.2"   # exact: the same seed must give the same inputs
check:
  type: python_import
  module: fuzzingbook.GrammarFuzzer
reference:
  kind: Online book
  authors: 'Zeller et al.'
  title: 'The Fuzzing Book'
family: probabilistic
capabilities:
  grammar: fuzzingbook-dict
  constraints: false
