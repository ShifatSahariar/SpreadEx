<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpreadEx</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="topbar">
  <div class="brand-lockup">
    <svg class="brand-logo" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-label="SpreadEx">
      <line x1="30" y1="30" x2="16.5" y2="16.5" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="43.5" y2="16.5" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="16.5" y2="43.5" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="43.5" y2="43.5" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="30" y2="17" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="30" y2="43" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="17" y2="30" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="43" y2="30" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="12" y="12" width="9" height="9" rx="1.5" fill="#5cb85c"/>
      <rect x="39" y="12" width="9" height="9" rx="1.5" fill="#5cb85c"/>
      <rect x="12" y="39" width="9" height="9" rx="1.5" fill="#5cb85c"/>
      <rect x="39" y="39" width="9" height="9" rx="1.5" fill="#5cb85c"/>
      <circle cx="30" cy="17" r="5" fill="#f5a623"/><circle cx="30" cy="43" r="5" fill="#f5a623"/>
      <circle cx="17" cy="30" r="5" fill="#f5a623"/><circle cx="43" cy="30" r="5" fill="#f5a623"/>
      <circle cx="30" cy="30" r="8" fill="#e53935"/><circle cx="30" cy="30" r="4.5" fill="#c62828"/>
    </svg>
    <span class="brand-wordmark">SpreadEx</span>
  </div>
  <span class="project mono" id="project"></span>
  <div class="tabs">
    <button id="tab-setup"   aria-selected="true"  onclick="go('setup')">Set up</button>
    <button id="tab-results" aria-selected="false" onclick="go('results')">Results</button>
  </div>
</div>

<div class="steps" id="steps"></div>
<main id="view"></main>

<script src="/static/app.js"></script>
</body>
</html>
