<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpreadEx</title>
<link rel="stylesheet" href="/static/app.css">
<script>
  // Applied before the stylesheet paints, so a reader who chose light never
  // sees a flash of dark (or the reverse).
  try {
    var t = localStorage.getItem("spreadex-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* storage can be blocked; the system preference still applies */ }
</script>
</head>
<body>
<header class="topbar">
  <!-- Exactly what the Home button does, by calling the same handler. A button
       and not a link on purpose: a link invites "open in new tab", which lands
       on a page with no access token. -->
  <button type="button" class="brand-lockup" id="brand" onclick="go('landing')"
          aria-label="SpreadEx, go to Home">
    <svg class="brand-logo" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <line x1="30" y1="30" x2="16.5" y2="16.5" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="43.5" y2="16.5" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="16.5" y2="43.5" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="43.5" y2="43.5" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="30" y2="17" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="30" y2="43" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="17" y2="30" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="43" y2="30" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="12" y="12" width="9" height="9" rx="1.5" fill="#5cb85c"/>
      <rect x="39" y="12" width="9" height="9" rx="1.5" fill="#5cb85c"/>
      <rect x="12" y="39" width="9" height="9" rx="1.5" fill="#5cb85c"/>
      <rect x="39" y="39" width="9" height="9" rx="1.5" fill="#5cb85c"/>
      <circle cx="30" cy="17" r="5" fill="#f5a623"/><circle cx="30" cy="43" r="5" fill="#f5a623"/>
      <circle cx="17" cy="30" r="5" fill="#f5a623"/><circle cx="43" cy="30" r="5" fill="#f5a623"/>
      <circle cx="30" cy="30" r="8" fill="#e53935"/><circle cx="30" cy="30" r="4.5" fill="#c62828"/>
    </svg>
    <span class="brand-wordmark">SpreadEx</span>
  </button>
  <span class="local-badge" id="local-badge"
        title="This UI is served from your own machine on 127.0.0.1. Your system under test, the inputs generated for it and every result stay in this project's .spreadex directory. The optional grammar assistant is the one feature that contacts anything else, and only when you ask it to.">
    <span class="dot" aria-hidden="true"></span>LOCAL</span>

  <nav class="tabs" aria-label="Sections">
    <button id="tab-home"    aria-selected="false" onclick="go('landing')"
            data-icon="home">Home</button>
    <button id="tab-setup"   aria-selected="false" onclick="go('setup')"
            data-icon="sliders">Setup</button>
    <button id="tab-results" aria-selected="false" onclick="go('results')"
            data-icon="chart">Campaigns</button>
  </nav>

  <div class="topbar-tools">
    <span class="topbar-sep" aria-hidden="true"></span>
    <button class="theme-toggle" id="theme" onclick="toggleTheme()"
            title="Switch between light and dark" aria-label="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4
           M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-button" id="settings" onclick="go('setup'); gotoStep('run')"
            title="Campaign settings (Review &amp; run)" aria-label="Campaign settings" data-icon="gear"></button>
  </div>
</header>

<nav class="steps" id="steps" aria-label="Setup steps"></nav>
<main id="view"></main>

<script src="/static/app.js"></script>
</body>
</html>
