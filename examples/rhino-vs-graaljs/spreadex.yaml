# Two independent JavaScript engines, same input, no expected output needed.
#
# This is the cheapest high-value oracle there is: you do not have to know what
# a generated program *should* print, only that two mature implementations
# should agree. Needs RHINO_JAR and GRAALJS_JARS; see README.md.
sut:
  timeout: 15s
  targets:
    - name: rhino
      command: ["java", "-cp", "${RHINO_JAR}",
                "org.mozilla.javascript.tools.shell.Main", "{input}"]
    - name: graaljs
      command: ["java",
                "-Dpolyglotimpl.AttachLibraryFailureAction=ignore",
                "-Dpolyglot.engine.WarnInterpreterOnly=false",
                "-cp", "${GRAALJS_JARS}/*",
                "com.oracle.truffle.js.shell.JSLauncher", "{input}"]

oracle:
  type: differential

  # The union of both engines' own diagnostics. An input both engines refuse is
  # AGREEMENT, not a divergence -- they just word it differently, and Rhino
  # exits 3 where GraalJS exits 7. The oracle compares the *class* of the exit
  # code for exactly this reason.
  #
  # What is a real divergence: one engine accepts what the other refuses, or
  # they both accept and print different things.
  rejection_patterns:
    - "^js: "            # Rhino
    - "^SyntaxError:"    # GraalJS
    - "^TypeError:"
    - "^ReferenceError:"
    - "^RangeError:"
    - "^Error:"

  crash_patterns:
    - "^Exception in thread"
    - "^\\s*at org\\.mozilla\\.javascript\\."
    - "^\\s*at com\\.oracle\\.truffle\\."
    - "^\\s*at org\\.graalvm\\."
    - "StackOverflowError"
    - "OutOfMemoryError"
    - "Internal error"

grammar:
  source: ../grammars/javascript.bnf

generators: [fuzzingbook, fandango, isla, grammarinator]

generation:
  count: 150

budget:
  generation: 3m
  execution: 5m

selection_signal: cc
embedding:
  model: tfidf
seed: 42
